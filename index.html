<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Mera Presentación</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Estilos de Reveal.js pa' que la vuelta se vea chimba -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.3.1/reset.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.3.1/reveal.min.css">
    <!-- Tema oscuro, puede cambiar "dracula" por "black" o "white" -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.3.1/theme/dracula.min.css">
</head>

<body>
    <div class="reveal">
        <div class="slides">

            <!-- Cada <section> es una diapositiva distinta -->
            <section>
                <h1>Título del Proyecto</h1>
                <p>Oe, esta es la portada de la presentación.</p>
            </section>

            <section>
                <h2>El mero contenido</h2>
                <p>Aquí es donde le vamos a tirar el texto, las imágenes de los juegos o lo que necesite.</p>
            </section>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.3.1/reveal.min.js"></script>
    <script>
        // Con esta mondá arranca la presentación
        Reveal.initialize();
    </script>
</body>

</html>
